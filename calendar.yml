name: Update ForexFactory calendar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the calendar
        run: |
          fetch() {
            curl -fsSL -A "Mozilla/5.0" "https://cdn-nfs.faireconomy.media/$1" -o "$1.tmp" \
              && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,list) and len(d)>0" "$1.tmp" \
              && mv "$1.tmp" "$1" \
              || rm -f "$1.tmp"
          }
          fetch ff_calendar_thisweek.json
          fetch ff_calendar_nextweek.json

      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update calendar"
            git push
          fi
