<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Syndicate Trade Journal Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="image/dark-syndicate-logo.png">
<style>
:root{
  --bg:#0c0d0f; --panel:#141619; --panel-2:#1b1e22; --line:#262a30; --line-2:#343942;
  --text:#e9ebee; --muted:#8c929b; --faint:#5f656e;
  --win:#a6d85a; --win-bg:rgba(166,216,90,.13); --win-line:rgba(166,216,90,.38);
  --loss:#ee5d50; --loss-bg:rgba(238,93,80,.13); --loss-line:rgba(238,93,80,.38);
  --warn:#e3b341; --warn-bg:rgba(227,179,65,.15);
  --be:#6aa6ff; --be-bg:rgba(106,166,255,.15);
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px}
h2{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.win{color:var(--win)} .loss{color:var(--loss)} .flat{color:var(--muted)} .be{color:var(--be)} .warnc{color:var(--warn)}
:focus-visible{outline:2px solid var(--win);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;padding:2px 10px 16px}
.brand .b1{font-size:21px;font-weight:600;letter-spacing:-.02em}
.brand .b2{color:var(--win);font-size:13.5px;font-weight:500;margin-top:4px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;color:var(--muted);background:none;border:0;cursor:pointer;text-align:left}
.nav a:hover,.nav button:hover{background:var(--panel);color:var(--text)}
.nav a[aria-current="page"]{background:var(--panel-2);color:var(--text)}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acctsel{display:block;margin:0 0 12px}
.acctsel .cap{display:block;color:var(--faint);font-size:12px;padding:0 4px 5px}
main{flex:1;min-width:0;padding:26px clamp(16px,3vw,40px) 40px}
.mobacct{display:none;margin-bottom:16px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabbar{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 15px;cursor:pointer;color:var(--text);min-height:40px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--win);border-color:var(--win);color:#11160a;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--loss);border-color:var(--loss-line);background:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;width:38px;height:38px;border-radius:10px;font-size:22px;line-height:1}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.linkbtn{background:none;border:0;padding:0;color:var(--text);cursor:pointer;font-weight:500}
.linkbtn:hover{text-decoration:underline}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;min-height:96px;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{border-color:var(--win);outline:none}
label.f,div.f{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
.hint{color:var(--faint);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:9px 16px;color:var(--muted);min-width:70px;text-align:center}
.seg input:checked+span{background:var(--panel-2);color:var(--text)}
.seg input:focus-visible+span{outline:2px solid var(--win);outline-offset:-2px}
.seg.sides input[value=Long]:checked+span,.seg.res input[value=Profit]:checked+span{background:var(--win-bg);color:var(--win)}
.seg.sides input[value=Short]:checked+span,.seg.res input[value=Loss]:checked+span{background:var(--loss-bg);color:var(--loss)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:16px;font-weight:500;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.stat .k{color:var(--muted);font-size:13.5px}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.02em}
.stat .s{color:var(--muted);font-size:13px}
.stat.gauge{align-items:center;text-align:center}
.stat.gauge svg{width:104px;height:60px;margin-top:auto}
.stat .v.sm{font-size:22px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:11.5px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
.toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.toggle button{background:none;border:0;padding:6px 12px;color:var(--muted);cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--panel-2);color:var(--text)}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 18px;display:flex;flex-direction:column;gap:9px}
.rule.bad{border-color:var(--loss-line)}
.rule .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rule .rh b{font-weight:600}
.rule .rf{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.rule .rn{color:var(--faint);font-size:12.5px}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--win)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--loss)}
.rules-empty{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px dashed var(--line-2);border-radius:16px;padding:14px 18px;margin-bottom:14px;color:var(--muted)}

/* pills */
.pill{display:inline-block;border-radius:7px;padding:2px 9px;font-size:13px;font-weight:500;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.win{background:var(--win-bg);color:var(--win)}
.pill.loss{background:var(--loss-bg);color:var(--loss)}
.pill.be{background:var(--be-bg);color:var(--be)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.chip{display:inline-block;border-radius:7px;padding:2px 9px;font-size:13px;background:var(--panel-2);color:var(--text);border:1px solid var(--line)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-weight:500;color:var(--muted);font-size:13px;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:var(--panel-2)}
td.r,th.r{text-align:right}
.thumb{width:54px;height:36px;border-radius:7px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);display:block}
.thumb.none{display:grid;place-items:center;color:var(--faint);font-size:11px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto;min-width:140px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.15fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.cal .dow{padding:10px 12px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);background:var(--panel)}
.cell{min-height:104px;padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cell .dn{font-size:14px;color:var(--text)}
.cell.out .dn{color:var(--faint)}
.cell .cv{font-size:15px;font-weight:600;margin-top:4px}
.cell .cn{font-size:12px;color:var(--muted)}
.cell.has.win{background:var(--win-bg)} .cell.has.win .cv{color:var(--win)}
.cell.has.loss{background:var(--loss-bg)} .cell.has.loss .cv{color:var(--loss)}
.cell.has.flat{background:var(--be-bg)}
a.cell:hover{filter:brightness(1.25)}
.cell.today .dn{color:var(--win);font-weight:600}
.cell.total{background:var(--panel-2);border-right:0}
.cell.total .dn{font-weight:500}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav h2{min-width:160px;text-align:center;color:var(--text);font-size:18px}

/* journal */
.mgroup{margin:26px 0 12px;color:var(--muted);font-size:14px;font-weight:500}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.jcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.jcard:hover{border-color:var(--line-2)}
.jcard .shot{aspect-ratio:16/9;background:var(--panel-2);display:block;width:100%;object-fit:cover;border-bottom:1px solid var(--line)}
.jcard .shot.none{display:grid;place-items:center;color:var(--faint)}
.jcard .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.jcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.jcard .d{font-weight:500}
.jcard .p{font-size:20px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* accounts */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.acard.active{border-color:var(--win-line)}
.acard .ah{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acard .ah h2{font-size:18px}
.acard .kv2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard .kv2 div span{display:block;color:var(--muted);font-size:13px}
.acard .kv2 div b{font-size:19px;font-weight:600}
.acard .rp{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.acard .rp div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.totals{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:18px;color:var(--muted)}
.totals b{display:block;font-size:22px;color:var(--text);font-weight:600}

/* day page */
.back{display:inline-flex;gap:6px;color:var(--muted);margin-bottom:14px}
.back:hover{color:var(--text)}
.props{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:0;max-width:720px}
.props>div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:46px}
.props>div:nth-child(odd){color:var(--muted)}
.props select{max-width:260px}
.field-block{max-width:720px;margin-top:26px}
.field-block h3{font-size:16px;margin-bottom:8px}
.sel-yes{color:var(--win)} .sel-no{color:var(--loss)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.gcard{display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0}
.gcard:hover{border-color:var(--line-2)}
.gcard img,.gcard .none{aspect-ratio:16/10;width:100%;object-fit:cover;background:var(--panel-2);display:grid;place-items:center;color:var(--faint)}
.gcard .b{padding:11px 13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gcard .m{padding:0 13px 11px;color:var(--muted);font-size:13px}


/* shell: top bar, bell, footer */
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(16px,3vw,40px);background:rgba(12,13,15,.94);border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.tb-brand{display:none;font-size:14px;line-height:1.2}
.tb-brand b{display:block;font-size:16px;font-weight:600}
.tb-brand span{color:var(--win)}
.mkchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line-2);border-radius:99px;font-size:13.5px;background:var(--panel);white-space:nowrap}
.mkchip:hover{border-color:var(--faint)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--win);box-shadow:0 0 0 3px var(--win-bg)}
.dot.off{background:var(--loss);box-shadow:0 0 0 3px var(--loss-bg)}
.mut{color:var(--muted)}
.bellwrap{position:relative}
.bell{position:relative;width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.bell:hover{border-color:var(--faint)}
.bell svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 12%}
.bell .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:99px;background:var(--loss);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.bell.shake svg{animation:bellring .8s ease-in-out}
@keyframes bellring{0%,100%{transform:rotate(0)}15%{transform:rotate(17deg)}30%{transform:rotate(-15deg)}45%{transform:rotate(11deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
.panel{position:absolute;right:0;top:calc(100% + 10px);width:min(390px,calc(100vw - 28px));max-height:min(72vh,540px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.panel ul{list-style:none;margin:0;padding:0}
.nt{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.nt:last-child{border-bottom:0}
.nt .nd{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--be)}
.nt.ok .nd{background:var(--win)} .nt.warn .nd{background:var(--warn)} .nt.bad .nd{background:var(--loss)}
.nt.new{background:var(--panel-2)}
.nt .nb{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.nt .ntime{color:var(--faint);font-size:12px;margin-top:3px}
.nempty{padding:24px 16px;color:var(--muted)}
.foot{padding:22px clamp(16px,3vw,40px);border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;text-align:center}
.alertbar{background:var(--loss-bg);border:1px solid var(--loss-line);border-radius:14px;padding:11px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.alertbar div{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* celebration */
.cel{position:fixed;inset:0;pointer-events:none;z-index:95;display:grid;place-items:center}
.cel .core{position:relative;width:132px;height:132px}
.cel .ringo{position:absolute;inset:0;border-radius:50%;border:3px solid var(--c);opacity:0;animation:celring .9s ease-out forwards}
.cel .badgec{position:absolute;inset:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;animation:celpop .55s cubic-bezier(.2,1.5,.4,1) both,celfade .4s ease-in 1s forwards}
.cel .badgec svg{width:44px;height:44px;fill:none;stroke:#0c0d0f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:celdraw .4s .22s ease-out forwards}
.cel i{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:0;animation:celburst .9s .08s ease-out forwards}
@keyframes celring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes celpop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes celfade{to{opacity:0;transform:scale(.9)}}
@keyframes celdraw{to{stroke-dashoffset:0}}
@keyframes celburst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}

/* news and market */
.evlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.evday{padding:10px 16px;color:var(--muted);font-size:13px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev.past{opacity:.55}
.ev .t{font-weight:600;padding-top:2px}
.ev .ti{min-width:0;overflow-wrap:anywhere}
.ev .sub2{display:flex;gap:10px;align-items:center;margin-top:5px;flex-wrap:wrap}
.ev .cd{color:var(--muted);font-size:13px}
.ev .icon-btn{width:34px;height:34px;font-size:20px}
.nextnews{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.nextnews .cdbig{font-size:clamp(26px,5vw,40px)}
.cdbig{font-size:clamp(30px,6vw,52px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cdmid{font-size:26px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mkbig{display:flex;flex-direction:column;gap:8px;padding:26px}
.mkbig .st{display:flex;align-items:center;gap:10px;font-size:17px}
.sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.sess{display:flex;flex-direction:column;gap:6px}
.sess .ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.setrow input[type=text]{width:130px}
.stackform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
details.card summary{cursor:pointer;font-weight:500}
.refcard ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.refcard .rn2{margin-top:12px;color:var(--faint);font-size:13px}

/* ---------- state ---------- */
const S = {

async function setupCloud() {

  const k = Math.min(6, n - 1), xl = [];
  for (let j = 1; j <= k; j++) { const i = Math.round((j / k) * (n - 1)); xl.push(`<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(labels[i])}</text>`); }
  const dots = n <= 160 ? vals.map((v, i) => i ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="7" fill="transparent"><title>${esc(labels[i])}: ${money(v, true)}</title></circle>` : "").join("") : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit and loss"><defs>
    <clipPath id="ca"><rect x="0" y="0" width="${W}" height="${z.toFixed(1)}"/></clipPath>
    <clipPath id="cb"><rect x="0" y="${z.toFixed(1)}" width="${W}" height="${(H - z).toFixed(1)}"/></clipPath></defs>
    ${grid}<line class="zero" x1="${L}" x2="${W - R}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}"/>
    <path d="${area}" fill="var(--win)" opacity=".13" clip-path="url(#ca)"/><path d="${area}" fill="var(--loss)" opacity=".13" clip-path="url(#cb)"/>
    <path d="${line}" fill="none" stroke="var(--win)" stroke-width="2.2" stroke-linejoin="round" clip-path="url(#ca)"/>
    <path d="${line}" fill="none" stroke="var(--loss)" stroke-width="2.2" stroke-linejoin="round" clip-path="url(#cb)"/>
    ${xl.join("")}${dots}</svg>`;
}
function barChart(items) {
  const W = 760, H = 220, L = 62, R = 12, T = 12, B = 26, n = items.length;
  const vals = items.map(i => i.v);
  const { y, ticks } = scaleFor(vals, H, T, B);
  const slot = (W - L - R) / n, bw = Math.min(38, slot * 0.7), z = y(0);
  const grid = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${compact(t)}</text>`).join("");
  const bars = items.map((it, i) => {
    const cx = L + slot * i + slot / 2, y1 = y(it.v), top = Math.min(y1, z), h = Math.max(2, Math.abs(y1 - z));
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${it.v >= 0 ? "var(--win)" : "var(--loss)"}"><title>${esc(it.label)}: ${money(it.v, true)}</title></rect>`;
  }).join("");
  const k = Math.min(6, n), xl = [];
  for (let j = 0; j < k; j++) { const i = k === 1 ? 0 : Math.round((j / (k - 1)) * (n - 1)); xl.push(`<text x="${(L + slot * i + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(items[i].label)}</text>`); }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily profit and loss">${grid}<line class="zero" x1="${L}" x2="${W - R}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}"/>${bars}${xl.join("")}</svg>`;
}
function gauge(p, good) {
  p = Math.max(0, Math.min(1, p));
  const r = 40, cx = 50, cy = 50, ex = cx - r * Math.cos(Math.PI * p), ey = cy - r * Math.sin(Math.PI * p);
  const col = good ? "var(--win)" : "var(--loss)";
  return `<svg viewBox="0 0 100 58" aria-hidden="true"><path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="var(--line-2)" stroke-width="9" stroke-linecap="round"/>${p > 0.005 ? `<path d="M10 50 A40 40 0 0 1 ${ex.toFixed(2)} ${ey.toFixed(2)}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"/>` : ""}</svg>`;
}

function renderTopbar(shake) {

function tickCountdowns() {
  const now = Date.now();
  let expired = false;
  document.querySelectorAll("[data-cdts]").forEach(el => {
    const rem = +el.dataset.cdts - now;
    if (rem <= 0) { expired = true; el.textContent = "now"; } else el.textContent = fmtCd(rem);
  });
  return expired;
}

  const rows = rulesFor(A, D);
  const rulesHtml = rows.length ? `<section class="rules" aria-label="Account rules">${rows.map(ruleHtml).join("")}</section><div class="hint" style="margin:-6px 0 16px">Rules use your closed trades only. Open, floating profit or loss isn't counted.</div>`
    : `<div class="rules-empty"><span>No rules set for this account yet. Add the max drawdown, daily drawdown and profit target to track them here.</span><button class="btn" type="button" data-act="editacct" data-id="${esc(A.id)}">Set rules</button></div>`;
  if (!st.n) return head + rulesHtml + rulesRef(A) + emptyState();
  const wr = st.winRate, pf = st.pf;
  const bias = st.longPct == null ? "–" : st.longPct === 0.5 ? "Even" : Math.round(Math.max(st.longPct, 1 - st.longPct) * 100) + "% " + (st.longPct > 0.5 ? "LONG" : "SHORT");
  const cards = `<section class="stats" aria-label="Summary">
    <div class="stat"><div class="k">Net P&amp;L</div><div class="v num ${cls(st.net)}">${money(st.net, true)}</div><div class="s">${D.start > 0 ? ((st.net / D.start) * 100).toFixed(1) + "% of account size" : "All trades"}</div></div>
    <div class="stat"><div class="k">Account balance</div><div class="v num">${money(D.balance)}</div><div class="s">Started at ${money(D.start)} · <button class="linkbtn" type="button" data-act="editacct" data-id="${esc(A.id)}">edit</button></div></div>
    <div class="stat gauge"><div class="k">Trade win %</div><div class="v num">${(wr * 100).toFixed(1)}%</div>${gauge(wr, wr >= 0.5)}</div>
    <div class="stat gauge"><div class="k">Profit factor</div><div class="v num">${pf == null ? "–" : pf === Infinity ? "∞" : pf.toFixed(2)}</div>${gauge(pf == null ? 0 : pf === Infinity ? 1 : Math.min(pf / 3, 1), pf == null || pf >= 1)}</div>
    <div class="stat"><div class="k">Avg win ÷ avg loss</div><div class="v num">${st.rr == null ? "–" : st.rr.toFixed(2)}</div><div class="s">Average winner against average loser</div></div>
    <div class="stat"><div class="k">Avg time in trade</div><div class="v num sm">${fmtDur(st.avgDur)}</div><div class="s">Across trades with a duration</div></div>
    <div class="stat"><div class="k">Directional bias</div><div class="v num sm">${bias}</div><div class="s">${st.longs} long · ${st.shorts} short</div></div>
    <div class="stat"><div class="k">Avg daily P&amp;L</div><div class="v num ${cls(st.avgDaily)}">${money(st.avgDaily, true)}</div><div class="s">Per trading day</div></div>
    <div class="stat"><div class="k">Best / worst day</div><div class="v num sm"><span class="${cls(st.best)}">${moneyTrim(st.best, true)}</span> / <span class="${cls(st.worst)}">${moneyTrim(st.worst, true)}</span></div><div class="s">Single-day results</div></div>
  </section>`;
  let vals = [0], labels = [""], run = 0;

  else D.dates.forEach(d => { run = r2(run + D.byDay[d].pnl); vals.push(run); labels.push(shortDate(d)); });
  const cum = `<section class="card chart"><div class="card-head"><h2>Cumulative P&amp;L</h2><div class="toggle" role="group" aria-label="Chart grouping"><button type="button" data-act="chartmode" data-v="trade" aria-pressed="${S.chartMode === "trade"}">By trade</button><button type="button" data-act="chartmode" data-v="day" aria-pressed="${S.chartMode === "day"}">By day</button></div></div>${vals.length > 1 ? lineChart(vals, labels) : ""}</section>`;

function pageCalendar(D) {
  S.month = S.month || todayStr().slice(0, 7);
  const [y, m] = S.month.split("-").map(Number);
  const startStr = weekStart(fmtD(new Date(y, m - 1, 1))), lastStr = fmtD(new Date(y, m, 0));
  const weeks = [];
  for (let c = startStr; c <= lastStr; c = addDays(c, 7)) weeks.push(Array.from({ length: 7 }, (_, i) => addDays(c, i)));
  const inMonth = D.dates.filter(d => d.slice(0, 7) === S.month);
  const monthPnl = r2(inMonth.reduce((a, d) => a + D.byDay[d].pnl, 0));
  const monthTrades = inMonth.reduce((a, d) => a + D.byDay[d].trades.length, 0);
  const today = todayStr();
  const needDay = D.acct.minDayProfitPct && D.acct.startBalance ? r2(D.acct.startBalance * D.acct.minDayProfitPct / 100) : null;
  const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`).join("") + `<div class="dow">Total</div>`;
  const rows = weeks.map((w, wi) => {
    const cells = w.map(d => {
      const dd = D.byDay[d], inM = d.slice(0, 7) === S.month, n = +d.slice(8);
      const base = `${inM ? "" : " out"}${d === today ? " today" : ""}`;
      if (dd) return `<a class="cell has ${cls(dd.pnl)}${base}" href="#/day/${d}" aria-label="${esc(longDate(d))}: ${money(dd.pnl, true)}, ${plural(dd.trades.length, "trade")}"><span class="dn">${n}</span><span class="cv num">${moneyTrim(dd.pnl, true)}</span><span class="cn">${plural(dd.trades.length, "trade")}${needDay != null && dd.pnl >= needDay ? " ✓" : ""}</span></a>`;
      return `<div class="cell${base}"><span class="dn">${n}</span></div>`;
    }).join("");
    const wk = D.byWeek[w[0]];
    const tot = wk ? `<div class="cell total"><span class="dn">Week ${wi + 1}</span><span class="cv num ${cls(wk.pnl)}">${moneyTrim(wk.pnl, true)}</span><span class="cn">${plural(wk.trades, "trade")}</span></div>` : `<div class="cell total"><span class="dn">Week ${wi + 1}</span></div>`;
    return cells + tot;
  }).join("");
  const nav = `<div class="monthnav"><button class="btn ghost" type="button" data-act="monthprev" aria-label="Previous month">‹</button><h2>${esc(monthName(S.month))}</h2><button class="btn ghost" type="button" data-act="monthnext" aria-label="Next month">›</button><button class="btn ghost" type="button" data-act="monthtoday">Today</button></div>`;
  return `<div class="page-head"><div><h1>Calendar</h1><div class="sub">${esc(acctLabel(D.acct))} · Monthly P&amp;L: <span class="num ${cls(monthPnl)}">${money(monthPnl, true)}</span> · ${plural(monthTrades, "trade")}</div></div><div class="actions">${nav}${addBtn()}</div></div><div class="cal" role="group" aria-label="Calendar">${dows}${rows}</div>${needDay != null ? `<div class="hint" style="margin-top:10px">✓ marks a day that counts as a trading day (it made at least ${pctTxt(D.acct.minDayProfitPct)}, ${money(needDay)}).</div>` : ""}`;
}

const thumb = (t, c = "thumb") => t.img && store.imgSrc(t.img) ? `<img class="${c}" src="${esc(store.imgSrc(t.img))}" alt="" loading="lazy">` : `<span class="${c} none">no image</span>`;

function pageTrades(D) {
  const f = S.filter;
  const list = D.trades.filter(t => (!f.pair || t.pair === f.pair) && (!f.side || t.side === f.side)).reverse();
  const head = `<div class="page-head"><div><h1>Trades</h1><div class="sub">${esc(acctLabel(D.acct))} · ${plural(list.length, "trade")}${list.length !== D.trades.length ? ` of ${D.trades.length}` : ""}</div></div><div class="actions">${S.downloads && D.trades.length ? `<button class="btn" type="button" data-act="export">${ICON.down}Download CSV</button>` : ""}${addBtn()}</div></div>`;
  if (!D.trades.length) return head + emptyState();
  const pairOpts = `<option value="">All pairs</option>` + [...new Set(D.trades.map(t => t.pair))].sort().map(p => `<option${p === f.pair ? " selected" : ""}>${esc(p)}</option>`).join("");
  const sideOpts = `<option value="">Long and short</option>` + ["Long", "Short"].map(s => `<option${s === f.side ? " selected" : ""}>${s}</option>`).join("");
  const filters = `<div class="filters"><select data-filter="pair" aria-label="Filter by pair">${pairOpts}</select><select data-filter="side" aria-label="Filter by side">${sideOpts}</select></div>`;
  const rows = list.map(t => `<tr data-act="trade" data-id="${esc(t.id)}"><td>${thumb(t)}</td><td class="num">${esc(midDate(t.date))}</td><td class="num">${esc(t.time || "–")}</td><td class="num">${fmtDur(t.durationMin)}</td><td><button class="linkbtn" type="button" data-act="trade" data-id="${esc(t.id)}">${esc(t.pair)}</button></td><td><span class="pill ${t.side === "Long" ? "win" : "loss"}">${esc(t.side)}</span></td><td class="r num ${cls(t.pnl)}">${money(t.pnl, true)}</td><td class="r num">${t.entry ?? "–"}</td><td class="r num">${t.exit ?? "–"}</td><td>${t.setup ? `<span class="chip">${esc(t.setup)}</span>` : ""}</td></tr>`).join("");
  return head + filters + `<div class="tablewrap"><table><thead><tr><th>Screenshot</th><th>Date</th><th>Entry time</th><th>Time in trade</th><th>Pair</th><th>Side</th><th class="r">P&amp;L</th><th class="r">Entry</th><th class="r">Exit</th><th>Setup</th></tr></thead><tbody>${rows || `<tr><td colspan="10" style="color:var(--muted)">No trades match those filters.</td></tr>`}</tbody></table></div>`;
}

function pageJournal(D) {
  const head = `<div class="page-head"><div><h1>Journal</h1><div class="sub">${esc(acctLabel(D.acct))} · One page per trading day, made for you from your trades</div></div><div class="actions">${addBtn()}</div></div>`;
  if (!D.dates.length) return head + emptyState();
  let out = "", lastM = "";
  [...D.dates].reverse().forEach(d => {
    const dd = D.byDay[d], m = d.slice(0, 7), res = dayResult(d, D);
    if (m !== lastM) { out += `${lastM ? "</div>" : ""}<div class="mgroup">${esc(monthName(m))}</div><div class="jgrid">`; lastM = m; }
    const withImg = dd.trades.find(t => t.img && store.imgSrc(t.img));
    const pairs = [...new Set(dd.trades.map(t => t.pair))];
    out += `<a class="jcard" href="#/day/${d}">${withImg ? `<img class="shot" src="${esc(store.imgSrc(withImg.img))}" alt="" loading="lazy">` : `<span class="shot none">no screenshot</span>`}<div class="body"><div class="row"><span class="d">${esc(midDate(d))}</span><span class="pill ${resClass(res)}">${res === "BE" ? "Break-even" : res}</span></div><div class="p num ${cls(dd.pnl)}">${money(dd.pnl, true)}</div><div class="chips">${pairs.map(p => `<span class="chip">${esc(p)}</span>`).join("")}</div><div style="color:var(--muted);font-size:13px">${plural(dd.trades.length, "trade")}</div></div></a>`;
  });
  return head + out + "</div>";

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const normImpact = s => (/high|red/i.test(s || "") ? "High" : /med|orange/i.test(s || "") ? "Medium" : /low|yellow/i.test(s || "") ? "Low" : "");

function parseTimeTok(line) {
  let m = line.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if (m) { let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; return { h, mi: +(m[2] || 0), idx: m.index, len: m[0].length }; }
  m = line.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  return m ? { h: +m[1], mi: +m[2], idx: m.index, len: m[0].length } : null;
}
const evKey = e => `${e.ts}|${(e.ccy || "").toUpperCase()}|${String(e.title).toLowerCase()}`;
function parseNewsLocal(text, base, tz) {
  const out = [], year = +base.slice(0, 4);
  let cur = base, lastT = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/\s+/g, " ").trim();
    if (!line) return;
    const iso = line.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
    const dm = line.match(/\b(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+([a-z]{3})[a-z]*\.?\s+(\d{1,2})\b/i);
    if (iso) cur = iso[0]; else if (dm && MONTHS[dm[1].toLowerCase()]) cur = `${year}-${pad(MONTHS[dm[1].toLowerCase()])}-${pad(+dm[2])}`;
    if (/all day|tentative/i.test(line)) return;
    const ccy = (line.match(/\b(USD|EUR|GBP|JPY|AUD|NZD|CAD|CHF|CNY)\b/) || [])[1];
    if (!ccy) return;
    const tm = parseTimeTok(line.replace(dm ? dm[0] : "\u0000", " "));
    const t = tm ? { h: tm.h, mi: tm.mi } : lastT;
    if (!t) return;
    lastT = t;
    let title = line.replace(dm ? dm[0] : "\u0000", " ");
    const tm2 = parseTimeTok(title);
    if (tm2) title = title.slice(0, tm2.idx) + " " + title.slice(tm2.idx + tm2.len);
    const impact = normImpact(line);
    title = title.replace(/\b(USD|EUR|GBP|JPY|AUD|NZD|CAD|CHF|CNY)\b/, " ").replace(/\b(high|medium|low|impact|expected|folder)\b/ig, " ").replace(/\d{4}-\d{2}-\d{2}/, " ").replace(/[|\t]+/g, " ").replace(/\s+/g, " ").trim();
    if (title.length < 3) return;
    const [y, mo, d] = cur.split("-").map(Number);
    out.push({ id: "n_" + uid() + Math.random().toString(36).slice(2, 5), ts: zonedToUtc(y, mo, d, t.h, t.mi, tz), ccy, title: title.slice(0, 120), impact });
  });
  return out;
}
function normNews(list, tz, base) {
  const out = [];
  list.forEach(it => {
    if (!it || typeof it !== "object") return;
    const date = /^\d{4}-\d{2}-\d{2}$/.test(String(it.date || "")) ? it.date : base;
    const tm = String(it.time || "").match(/^(\d{1,2}):(\d{2})/);
    const title = String(it.title || "").trim();
    if (!tm || +tm[1] > 23 || +tm[2] > 59 || !title) return;
    const [y, mo, d] = date.split("-").map(Number);
    out.push({ id: "n_" + uid() + Math.random().toString(36).slice(2, 5), ts: zonedToUtc(y, mo, d, +tm[1], +tm[2], tz), ccy: String(it.currency || it.ccy || "").toUpperCase().slice(0, 4), title: title.slice(0, 120), impact: normImpact(it.impact) });
  });
  return out;
}
function pruneNews() {
  const cut = Date.now() - 24 * 3600e3, n = S.news.items.length;
  S.news.items = S.news.items.filter(e => e.ts >= cut);

}
function addEvents(list) {
  const have = new Set(S.news.items.map(evKey));
  let added = 0;

  saveNews();

function beep() {

  try {
    const t0 = actx.currentTime;
    [0, 0.22].forEach(dt => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.17);
      o.connect(g); g.connect(actx.destination);

}

async function shrink(file, max = 2000) {
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 1.5e6 && /^image\/(png|jpeg|webp)$/.test(file.type)) return file;
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
    return blob || file;
  } catch (e) { return file; }
}

const READ_PROMPT = `You are reading a screenshot of ONE trade (open or closed) taken from a trading platform such as MetaTrader, TradingView, cTrader or a broker app.
Read only what is visible. Return these fields:
- pair: the instrument symbol in capitals with no slash, e.g. "XAUUSD", "EURUSD", "NAS100"
- side: "Long" for a buy, "Short" for a sell
- entry: the entry (open) price as a number
- exit: the exit (close) price as a number
- pnl: the profit or loss of the trade in account currency as a signed number (negative for a loss)

- date: the date the trade was opened, "YYYY-MM-DD"
- time: the time the trade was opened, 24-hour "HH:MM"
- closeDate: the date the trade was closed, "YYYY-MM-DD"

Use null for any field you cannot read with confidence. Never guess or calculate a value that is not shown.
Reply with only a JSON object like {"pair":"XAUUSD","side":"Long","entry":2650.5,"exit":2662.1,"pnl":116.0,"lots":0.1,"date":"2026-10-09","time":"10:04","closeDate":"2026-10-09","closeTime":"11:24"}`;

async function handleFile(file) {
  const draft = S.draft;
  if (!draft || !file || !file.type.startsWith("image/")) return;
  const st = $("#rstat");
  st.className = "status busy"; st.textContent = "Preparing screenshot…";
  const blob = await shrink(file);
  if (S.draft !== draft) return;
  if (draft.url) URL.revokeObjectURL(draft.url);
  draft.blob = blob; draft.url = URL.createObjectURL(blob);
  showPreview(draft.url);
  if (S.canRead && S.sample) readShot(draft);
  else { st.className = "status"; st.textContent = "Screenshot added. Fill in the details."; }
}

async function readShot(draft) {
  const st = $("#rstat"), stop = $("#stopbtn");
  st.className = "status busy"; st.textContent = "Reading your screenshot…";
  stop.hidden = false;
  const ctl = new AbortController();
  draft.ctl = ctl;
  try {
    const r = await S.sample.json(READ_PROMPT, { images: draft.blob, signal: ctl.signal, modelTier: "default" });
    if (S.draft !== draft) return;
    const n = applyExtract(r);
    st.className = "status " + (n ? "ok" : "err");
    st.textContent = n >= 4 ? "Done. Check the details, then add your notes and save." : n ? "Filled in what I could read. Add the rest." : "No trade details found in that image. Fill them in below.";
  } catch (e) {
    if (S.draft !== draft) return;
    if (e && e.code === "cancelled") { st.className = "status"; st.textContent = "Stopped. Fill in the details below."; }
    else { st.className = "status err"; st.textContent = readErr(e); }
  } finally {
    draft.ctl = null;
    const sb = $("#stopbtn"); if (sb) sb.hidden = true;
  }
}

function applyExtract(r) {
  if (!r || typeof r !== "object" || Array.isArray(r)) return 0;
  let n = 0;
  const set = (id, v) => { const el = $("#" + id); if (el && v != null && v !== "") { el.value = v; n++; } };
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")) && !isNaN(parseD(s)) && s <= addDays(todayStr(), 1);
  const hhmm = s => { const tm = String(s || "").match(/^(\d{1,2}):(\d{2})/); return tm && +tm[1] < 24 && +tm[2] < 60 ? pad(+tm[1]) + ":" + tm[2] : null; };
  const pair = normPair(r.pair); if (pair) set("f-pair", pair);
  const side = String(r.side || "").toLowerCase();
  if (/short|sell/.test(side)) { setRadio("side", "Short"); n++; } else if (/long|buy/.test(side)) { setRadio("side", "Long"); n++; }
  const en = num(r.entry), ex = num(r.exit), lots = num(r.lots), p = num(r.pnl);
  if (en != null) set("f-entry", en);
  if (ex != null) set("f-exit", ex);
  if (lots != null) set("f-lots", lots);
  if (p != null) { $("#f-amt").value = Math.abs(p); setRadio("res", p < 0 ? "Loss" : "Profit"); n++; }
  if (isDate(r.date)) set("f-date", r.date);
  const t1 = hhmm(r.time); if (t1) set("f-time", t1);
  const t2 = hhmm(r.closeTime); if (t2) set("f-xtime", t2);
  if (t2 && isDate(r.closeDate) && r.closeDate !== $("#f-date").value) set("f-xdate", r.closeDate);
  syncDur();
  return n;
}

async function saveTrade() {
  const draft = S.draft, err = $("#aerr"), btn = $("#savebtn");
  const v = id => $("#" + id).value.trim();
  const pair = normPair(v("f-pair")), date = v("f-date"), accId = v("f-acct");
  const amt = num(v("f-amt"));
  if (!acctOf(accId)) { err.textContent = "Choose which account this trade belongs to."; return; }
  if (!pair) { err.textContent = "Enter the pair, for example XAUUSD."; $("#f-pair").focus(); return; }
  if (amt == null) { err.textContent = "Enter the amount you made or lost."; $("#f-amt").focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = "Choose the entry date."; $("#f-date").focus(); return; }
  const xdate = v("f-xdate") || null, xtime = v("f-xtime") || null;
  let dur = calcDur(date, v("f-time"), xdate, xtime);
  if (dur == null && v("f-dur")) {
    dur = parseDur(v("f-dur"));
    if (dur == null) { err.textContent = "Enter the time in trade like 1h 20m, 45m or 2h."; $("#f-dur").focus(); return; }
  }
  const isLoss = document.querySelector('input[name="res"]:checked').value === "Loss" || amt < 0;
  const pnl = r2((isLoss ? -1 : 1) * Math.abs(amt));
  const prev = draft.editing ? S.trades.find(t => t.id === draft.editing) : null;
  const A = acctOf(accId);
  const before = ruleStatuses(rulesFor(A, derive(accId)));
  const t = {
    ...(prev || { id: "t_" + uid(), createdAt: Date.now() }), kind: "trade", accountId: accId, pair, date, time: v("f-time") || null,
    closeDate: xdate, closeTime: xtime, durationMin: dur,
    side: document.querySelector('input[name="side"]:checked').value, entry: num(v("f-entry")), exit: num(v("f-exit")), pnl,
    lots: num(v("f-lots")), setup: v("f-setup") || null, why: v("f-why") || null, how: v("f-how") || null, outcome: v("f-out") || null,
    notes: null, img: prev ? prev.img || null : null
  };
  btn.disabled = true; btn.textContent = "Saving…"; err.textContent = "";
  let oldImg = null;
  if (draft.blob) {
    try { const ref = await store.putImage(draft.blob); oldImg = t.img; t.img = ref; }
    catch (e) { err.textContent = "The screenshot couldn't be stored. Try again, or save without it."; btn.disabled = false; btn.textContent = prev ? "Save changes" : "Save trade"; return; }
  }
  const i = S.trades.findIndex(x => x.id === t.id);
  if (i >= 0) S.trades[i] = t; else S.trades.push(t);
  persist(t);
  if (oldImg) store.delImage(oldImg).catch(() => {});
  if (accId !== S.settings.activeAccount) { S.settings.activeAccount = accId; saveSettings(); }
  closeModal(true);
  render();
  const typeTxt = A.type ? ` (${A.type})` : "";
  pushNotif({ type: "trade", tone: pnl >= 0 ? "ok" : "warn", title: `${prev ? "Trade updated" : "Trade added"} · ${pair} ${t.side} ${money(pnl, true)}`, body: `${A.name}${typeTxt} · ${shortDate(date)}${t.time ? " " + t.time : ""}`, acct: accId });
  let worst = null;
  {
    const rowsAfter = rulesFor(A, derive(accId));
    rowsAfter.forEach(r => {
      if (!r.st || r.st === "ok") return;
      const was = before[r.key];
      if (was === "bad" || was === r.st) return;
      pushNotif({ type: "rule", tone: r.st === "bad" ? "bad" : "warn", title: `${r.short} ${r.st === "bad" ? "breached" : "close to limit"} · ${A.name}${typeTxt}`, body: `${r.left}. ${r.right}.`, acct: accId, alert: true });
      if (r.st === "bad") worst = "bad"; else if (!worst) worst = "warn";
    });
  }
  celebrate(worst === "bad" ? "bad" : worst === "warn" ? "warn" : pnl < 0 ? "warn" : "ok");
  if (!worst) toast(prev ? "Trade updated" : `Trade saved to ${A.name}`);
}

function deleteTrade(id) {
  const t = S.trades.find(x => x.id === id);
  if (!t) return;
  S.trades = S.trades.filter(x => x.id !== id);
  unpersist(id);
  if (t.img) store.delImage(t.img).catch(() => {});
  closeModal(true);
  render();
  toast("Trade deleted");
}

/* ---------- day journal fields ---------- */
const dayTimers = {};
function setDayField(date, field, value) {
  const A = activeAcct(); if (!A) return;
  const k = dayKey(A.id, date);
  const d = S.days[k] || (S.days[k] = { id: "day_" + A.id + "_" + date, kind: "day", accountId: A.id, date });
  d[field] = value;
  clearTimeout(dayTimers[k]);
  dayTimers[k] = setTimeout(() => flushDay(date), 600);
}
function flushDay(date) {
  const A = activeAcct(); if (!A) return;
  const k = dayKey(A.id, date);
  clearTimeout(dayTimers[k]);
  if (S.days[k]) persist({ ...S.days[k] });
}

/* ---------- csv ---------- */
async function exportCsv() {
  const D = S.D; if (!D) return;
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [["Account", "Date", "Entry time", "Exit date", "Exit time", "Time in trade (min)", "Pair", "Side", "Entry", "Exit", "P&L", "Lots", "Setup", "Why", "How", "Outcome"]];
  D.trades.forEach(t => rows.push([acctLabel(D.acct), t.date, t.time, t.closeDate, t.closeTime, t.durationMin, t.pair, t.side, t.entry, t.exit, t.pnl, t.lots, t.setup, t.why || t.notes, t.how, t.outcome]));
  try { await S.downloads.save({ filename: "trading-journal.csv", data: rows.map(r => r.map(q).join(",")).join("\n") }); }
  catch (e) { if (!e || e.code !== "cancelled") toast("The file couldn't be saved.", true); }
}

/* ---------- alerts ---------- */
function checkAlerts() {
  if (!S.ready) return;
  const now = Date.now();
  const leads = [...S.settings.newsLeads].sort((a, b) => a - b);
  S.news.items.forEach(e => {
    const rem = e.ts - now;
    if (rem <= 0) return;
    const due = leads.filter(L => rem <= L * 60000);
    if (!due.length) return;
    const fresh = due.filter(L => !firedBefore(`news:${e.id}:${L}`));
    if (!fresh.length) return;
    const mins = Math.max(1, Math.ceil(rem / 60000));
    pushNotif({ type: "news", tone: e.impact === "High" ? "bad" : "warn", title: `${e.ccy ? e.ccy + " " : ""}news in ${mins} min`, body: `${e.title}${e.impact ? " · " + e.impact + " impact" : ""} at ${timeOnly(e.ts)}`, alert: true, high: e.impact === "High" });
  });
  const fx = fxState(now), rem = fx.nextTs - now, L = S.settings.marketLead;
  if (rem > 0 && rem <= L * 60000 && !firedBefore(`mkt:${fx.open ? "close" : "open"}:${fx.nextTs}:${L}`)) {
    const mins = Math.max(1, Math.ceil(rem / 60000));
    pushNotif({ type: "market", tone: "warn", title: `FX market ${fx.open ? "closes" : "opens"} in ${mins} min`, body: `${fx.open ? "Closes" : "Opens"} ${fmtWhen(fx.nextTs)} your time.${fx.open ? " Close or manage open trades before the weekend." : ""}`, alert: true });
  }
}
let tickN = 0;
function tick() {
  tickN++;
  const expired = tickCountdowns();
  if (expired) {
    const a = document.activeElement;
    if (a && a.closest && a.closest("[data-keep]")) renderTopbar(); else render();
  }
  if (tickN % 10 === 0) checkAlerts();
  if (STANDALONE && S.settings.ffAuto && tickN % 1800 === 0) loadFF({ silent: true });
}

/* ---------- events ---------- */
const needAcct = () => { toast("Add an account first, then you can add trades to it."); openModal({ type: "acct" }); };
function closeBell(focus) {
  if (!S.bell) return;
  S.bell = false;
  renderTopbar();
  if (focus) { const b = $("#bell"); if (b) b.focus(); }
}
const ACTS = {
  add: el => { if (!S.accounts.length) return needAcct(); openModal({ type: "add", date: el.dataset.date || null }); },
  edit: el => openModal({ type: "add", edit: el.dataset.id }),
  trade: el => openModal({ type: "trade", id: el.dataset.id }),
  newacct: () => openModal({ type: "acct" }),
  editacct: el => openModal({ type: "acct", edit: el.dataset.id || (activeAcct() || {}).id }),
  acctdel: () => { S.modal.confirm = true; renderModal(); },
  acctdelcancel: () => { S.modal.confirm = false; renderModal(); },
  acctdelok: el => deleteAcct(el.dataset.id),
  saveacct: () => saveAcct(),
  readrules: () => readRules(),
  useacct: el => { S.settings.activeAccount = el.dataset.id; saveSettings(); if (location.hash === "#/dashboard") { render(); } else location.hash = "#/dashboard"; },
  gotoday: el => { if (el.dataset.acct && el.dataset.acct !== S.settings.activeAccount) { S.settings.activeAccount = el.dataset.acct; saveSettings(); } },
  close: () => closeModal(),
  overlay: (el, e) => { if (e.target === el) closeModal(); },
  zoom: () => { const b = $("#shotbox"); if (b) b.classList.toggle("zoomed"); },
  del: () => { S.modal.confirm = true; renderModal(); },
  delcancel: () => { S.modal.confirm = false; renderModal(); },
  delok: el => deleteTrade(el.dataset.id),
  savetrade: () => saveTrade(),
  stopread: () => { if (S.draft && S.draft.ctl) S.draft.ctl.abort(); },
  monthprev: () => { const [y, m] = S.month.split("-").map(Number); S.month = fmtD(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  monthnext: () => { const [y, m] = S.month.split("-").map(Number); S.month = fmtD(new Date(y, m, 1)).slice(0, 7); render(); },
  monthtoday: () => { S.month = todayStr().slice(0, 7); render(); },
  chartmode: el => { S.chartMode = el.dataset.v; render(); },
  export: () => exportCsv(),
  bell: () => {
    S.bell = !S.bell;
    if (S.bell) { S.seen = S.notifs.readAt; S.notifs.readAt = Date.now(); saveNotifs(); }
    renderTopbar();
    const b = $("#bell"); if (b) b.focus();
  },
  soundtoggle: () => { S.settings.sound = !S.settings.sound; saveSettings(); renderTopbar(); if (S.settings.sound) beep(); },
  clearnotifs: () => { S.notifs.items = []; S.notifs.readAt = Date.now(); saveNotifs(); renderTopbar(); },
  readnews: () => readNews(),
  addnewsmanual: () => addNewsManual(),
  delnews: el => { S.news.items = S.news.items.filter(e => e.id !== el.dataset.id); saveNews(); render(); },
  clearnews: () => { S.news.items = []; saveNews(); render(); },
  ffload: () => loadFF(),
  ffaddshown: () => ffAddShown(),
  profile: () => openModal({ type: "profile" }),
  changepw: () => changePw(),
  signout: () => signOut(),
  delprofile: el => delProfile(el),
  saveemail: () => saveEmail(),
  testemail: () => testEmail()
};
document.addEventListener("click", e => {
  if (S.bell && !e.target.closest(".bellwrap")) closeBell(false);
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACTS[el.dataset.act];
  if (fn) fn(el, e);
});
function applySetting(k, val) {
  if (k === "ffAuto") {
    S.settings.ffAuto = !!val; saveSettings();
    if (S.settings.ffAuto) { if (S.ff.status === "ok") ffAutoAdd(); else loadFF(); }
    render(); toast(S.settings.ffAuto ? "High-impact news will set alerts automatically" : "Automatic alerts turned off");
    return;
  }
  if (k === "newsLeads") {
    const a = parseLeads(val);
    if (!a.length) { toast("Enter minutes like 15, 10.", true); render(); return; }
    S.settings.newsLeads = a;
  } else if (k === "marketLead") {
    const n = num(val);
    if (n == null || n < 1 || n > 240) { toast("Enter minutes between 1 and 240.", true); render(); return; }
    S.settings.marketLead = Math.round(n);
  }
  saveSettings(); render(); toast("Alert times saved");
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-acctsel")) {
    if (t.value === "__new") { render(); openModal({ type: "acct" }); return; }
    S.settings.activeAccount = t.value; saveSettings(); S.filter = { pair: "", side: "" };
    if (S.route.name === "day") location.hash = "#/journal"; else render();
    return;
  }
  if (t.dataset && t.dataset.setting) { applySetting(t.dataset.setting, t.type === "checkbox" ? t.checked : t.value); return; }
  if (t.dataset && t.dataset.ff) { S.ff[t.dataset.ff] = t.value; render(); return; }
  if (t.dataset && t.dataset.newsfield) {
    S.newsDraft[t.dataset.newsfield] = t.value;
    if (t.dataset.newsfield === "tz") { S.settings.newsTz = t.value; saveSettings(); }
    return;
  }
  if (t.dataset && t.dataset.filter) { S.filter[t.dataset.filter] = t.value; render(); return; }
  if (t.dataset && t.dataset.day && S.route.name === "day") {
    setDayField(S.route.date, t.dataset.day, t.value);
    if (t.tagName === "SELECT") { flushDay(S.route.date); render(); }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.tagName === "TEXTAREA" && t.dataset && t.dataset.day && S.route.name === "day") setDayField(S.route.date, t.dataset.day, t.value);
  if (t.dataset && t.dataset.newsfield === "text") S.newsDraft.text = t.value;
  if (t.id && /^a-(size|max|day|tgt|tl|mdp)$/.test(t.id)) updAcctPrev();
});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.day && S.route.name === "day") flushDay(S.route.date);
  if (S.dirty) setTimeout(() => {
    const a = document.activeElement;
    if (!(a && a.closest && a.closest("[data-keep]"))) { S.dirty = false; render(); }
  }, 0);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (S.modal) closeModal(); else closeBell(true);
});
document.addEventListener("paste", e => {
  if (!S.modal || S.modal.type !== "add") return;
  const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); handleFile(f); }
});
window.addEventListener("dragover", e => { if (S.modal) e.preventDefault(); });
window.addEventListener("drop", e => { if (S.modal) e.preventDefault(); });
window.addEventListener("hashchange", onRoute);

/* ---------- start ---------- */
async function init() {
  S.route = parseRoute();
  render();
  if (window.claude && typeof window.claude.use === "function") {
    claude.use("sample").then(async s => {
      if (!s) return;
      S.sample = s;
      const l = await s.limits().catch(() => null);
      S.canRead = !!(l && l.images);
    }).catch(() => {});
    claude.use("downloads").then(d => { if (d) { S.downloads = d; if (S.ready) render(); } }).catch(() => {});
  } else {
    S.downloads = standaloneDownloads();
  }
  let ok = false;
  try { ok = await setupCloud(); } catch (e) { ok = false; }
  if (!ok && STANDALONE && sbOn()) {
    try { ok = await startSupabase(); }
    catch (e) { sbFatal(e && e.message ? e.message : "Something went wrong while opening your journal."); return; }
  }
  if (!ok) {
    const standalone = !(window.claude && typeof window.claude.use === "function");
    if (standalone && authOk()) {
      try {
        let key = await rememberedUser();
        if (!key) key = await requireLogin();
        const u = await userGet(key);
        S.auth = { key, display: (u && u.display) || key };
        S.dbName = "dstj-" + key;
      } catch (e) {
        document.body.classList.remove("gated");
        $("#gate").hidden = true;
        S.notice = "Profiles aren't available in this browser, so your journal isn't protected by a login.";
      }
    }
    await setupLocal();
  }
  migrate();
  if (S.auth) {
    const u = S.mode === "supabase" ? { email: S.auth.email } : await userGet(S.auth.key).catch(() => null);
    if (u && u.email && !S.settings.email) { S.settings.email = u.email; saveSettings(); }
  }
  S.newsDraft.tz = S.settings.newsTz || "local";
  if (pruneNews()) saveNews();
  S.ready = true;
  render();
  checkAlerts();
  if (STANDALONE && S.settings.ffAuto) loadFF({ silent: true });
  window.addEventListener("focus", syncNow);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  setInterval(tick, 1000);
}
init();
})();
</script>
