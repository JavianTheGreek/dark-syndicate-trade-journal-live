name: Update ForexFactory calendar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the calendar
        run: |
          get() {
            for host in cdn-nfs.faireconomy.media nfs.faireconomy.media; do
              code=$(curl -sS -L -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" -H "Accept: application/json" -o "$1.tmp" -w "%{http_code}" "https://$host/$1" || echo "000")
              echo "$1 from $host -> HTTP $code"
              if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,list) and len(d)>0" "$1.tmp"; then
                mv "$1.tmp" "$1"
                return 0
              fi
              rm -f "$1.tmp"
            done
            return 1
          }
          get ff_calendar_thisweek.json || { echo "COULD NOT DOWNLOAD THIS WEEK'S CALENDAR"; exit 1; }
          get ff_calendar_nextweek.json || echo "Next week is not available yet (this is normal)"

      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update calendar"
            git push
          fi
